    <script>

                    { id: 15, class: "IIa", level: "C", text: "Debería considerarse la interrupción de la vigilancia en pacientes con pequeños AAA, que no se espera que alcancen el umbral de reparación, o no son aptos, o prefieren manejo conservador." },

                    { id: 125, class: "IIa", level: "C", text: "Debería considerarse perfusión renal fría en cirugía abierta con clampaje > 25 min." },

            {

                title: "9. Aneurisma de Arteria Ilíaca",
                recommendations: [

                    { id: 135, class: "IIa", level: "C", text: "Debería considerarse reparación electiva de aneurisma ilíaco a ≥ 40 mm." },

            {

                recommendations: [

                ]
            },
            {
                id: "sec-11",
                title: "11. Toma de Decisiones Compartida",
                recommendations: [
                    { id: 159, class: "I", level: "B", text: "Se recomienda facilitar la toma de decisiones compartida en cribado y reparación de AAA." },
                    { id: 160, class: "IIa", level: "A", text: "Debería considerarse el uso de herramientas de apoyo a la decisión para pacientes." }
                ]
            }
        ];

        // --- LÓGICA DE RENDERIZADO ---

        const contentArea = document.getElementById('content-area');
        const tocList = document.getElementById('toc-list');
        const themeToggle = document.getElementById('theme-toggle');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const searchInput = document.getElementById('search-input');
        const totalRecsSpan = document.getElementById('total-recs');

        let currentFilter = 'all';

        function getStyles(recClass) {
            if (recClass === 'I') return {
                bg: 'bg-recI-light dark:bg-recI-dark',
                border: 'border-l-4 border-recI-border',
                text: 'text-recI-text dark:text-recI-darkText',
                badge: 'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200'
            };
            if (recClass === 'IIa') return {
                bg: 'bg-recIIa-light dark:bg-recIIa-dark',
                border: 'border-l-4 border-recIIa-border',
                text: 'text-recIIa-text dark:text-recIIa-darkText',
                badge: 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200'
            };
            if (recClass === 'IIb') return {
                bg: 'bg-recIIb-light dark:bg-recIIb-dark',
                border: 'border-l-4 border-recIIb-border',
                text: 'text-recIIb-text dark:text-recIIb-darkText',
                badge: 'bg-orange-100 text-orange-800 dark:bg-orange-900 dark:text-orange-200'
            };
            if (recClass === 'III') return {
                bg: 'bg-recIII-light dark:bg-recIII-dark',
                border: 'border-l-4 border-recIII-border',
                text: 'text-recIII-text dark:text-recIII-darkText',
                badge: 'bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200'
            };
            return {};
        }

        function renderContent() {
            contentArea.innerHTML = '';
            tocList.innerHTML = '';

            let totalCount = 0;
            let sectionCount = 0;

            sections.forEach(section => {
                const filteredRecs = section.recommendations.filter(rec => {
                    const matchesType = currentFilter === 'all' || rec.class === currentFilter;
                    const searchTerm = searchInput.value.toLowerCase();
                    const matchesSearch = rec.text.toLowerCase().includes(searchTerm) ||
                        rec.id.toString().includes(searchTerm) ||
                        section.title.toLowerCase().includes(searchTerm);
                    return matchesType && matchesSearch;
                });

                if (filteredRecs.length > 0) {
                    sectionCount++;

                    // TOC Item
                    const li = document.createElement('div');
                    li.innerHTML = `<a href="#${section.id}" class="block py-2 px-3 rounded text-sm hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-400 transition-colors truncate" title="${section.title}">${section.title}</a>`;
                    tocList.appendChild(li);

                    // Section Container
                    const secDiv = document.createElement('section');
                    secDiv.id = section.id;
                    secDiv.className = "scroll-mt-24";

                    // Header
                    secDiv.innerHTML = `<h2 class="text-xl md:text-2xl font-bold text-slate-800 dark:text-slate-100 mb-6 pb-2 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                        ${section.title}
                        <span class="text-sm font-normal text-slate-400 ml-2 bg-slate-100 dark:bg-slate-700 px-2 py-1 rounded-full">${filteredRecs.length}</span>
                    </h2>`;

                    // Grid
                    const grid = document.createElement('div');
                    grid.className = "grid grid-cols-1 md:grid-cols-2 xl:grid-cols-2 gap-6";

                    filteredRecs.forEach(rec => {
                        totalCount++;
                        const style = getStyles(rec.class);
                        const card = document.createElement('div');

                        card.className = `relative p-6 rounded-xl shadow-sm ${style.bg} ${style.border} hover:shadow-md transition-all duration-300 flex flex-col justify-between`;

                        card.innerHTML = `
                            <div>
                                <div class="flex justify-between items-start mb-3">
                                    <span class="${style.badge} text-[10px] uppercase font-bold px-2 py-1 rounded border border-current opacity-80 tracking-wider">Clase ${rec.class}</span>
                                    <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 bg-white/60 dark:bg-black/20 px-2 py-1 rounded backdrop-blur-sm">Nivel ${rec.level}</span>
                                </div>
                                <p class="${style.text} font-medium text-base md:text-lg leading-snug mb-2">
                                    <span class="font-bold opacity-75 mr-1">#${rec.id}</span> ${rec.text}
                                </p>
                            </div>
                            <div class="flex justify-end mt-4 pt-3 border-t border-black/5 dark:border-white/5">
                                <button onclick="copyToClipboard('${rec.text.replace(/'/g, "\\'")}')" class="text-xs text-slate-500 hover:text-primary-600 flex items-center gap-1 transition-colors group opacity-60 hover:opacity-100">
                                    <span class="group-hover:underline">Copiar</span>
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                                </button>
                            </div>
                        `;
                        grid.appendChild(card);
                    });

                    secDiv.appendChild(grid);
                    contentArea.appendChild(secDiv);
                }
            });

            totalRecsSpan.innerText = totalCount;

            if (sectionCount === 0) {
                contentArea.innerHTML = `
                    <div class="text-center py-20 opacity-50">
                        <svg class="w-16 h-16 mx-auto mb-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <p class="text-xl">No se encontraron recomendaciones con estos filtros.</p>
                    </div>`;
            }

            setupScrollSpy();
        }

        // --- FILTROS Y EVENTOS ---

        window.filterRecs = (filterType) => {
            currentFilter = filterType;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === filterType) {
                    btn.classList.add('ring-2', 'ring-primary-600', 'ring-offset-1');
                } else {
                    btn.classList.remove('ring-2', 'ring-primary-600', 'ring-offset-1');
                }
            });
            renderContent();
        };

        searchInput.addEventListener('input', renderContent);

        // Dark Mode
        const html = document.documentElement;
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        } else {
            html.classList.remove('dark');
        }
        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
        });

        // Mobile Menu
        function toggleSidebar() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
                document.body.style.overflow = '';
            }
        }
        mobileMenuBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        // Copy
        window.copyToClipboard = (text) => {
            navigator.clipboard.writeText(text);
            // Visual feedback could be added here
        };

        // ScrollSpy
        function setupScrollSpy() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        document.querySelectorAll('#toc-list a').forEach(link => {
                            link.classList.remove('nav-active');
                            if (link.getAttribute('href').substring(1) === entry.target.id) {
                                link.classList.add('nav-active');
                                link.scrollIntoView({ behavior: "smooth", block: "center" });
                            }
                        });
                    }
                });
            }, { rootMargin: "-10% 0px -80% 0px" });

            document.querySelectorAll('section').forEach(section => observer.observe(section));
        }

        // Init
        renderContent();

    </script>
</body>
